<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>차단된 사이트</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Malgun Gothic", sans-serif;
        color: #172033;
        background: #f7f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        border: 1px solid #d7dce7;
        border-radius: 8px;
        background: #ffffff;
        padding: 32px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #667085;
        font-size: 16px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>지금은 차단된 사이트입니다</h1>
      <p>설정한 시간이 끝나면 다시 접속할 수 있습니다.</p>
    </main>
  </body>
</html>
